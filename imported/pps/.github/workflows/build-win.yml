name: Build Windows app

# Builds the Windows installer of the PPS Study app on a GitHub-hosted runner
# so lab staff can download it from the Actions tab without installing Node or
# Rust. The installer is unsigned — Windows SmartScreen shows a warning on
# first run (More info -> Run anyway).

on:
  workflow_dispatch: # lets you trigger a build manually from the Actions tab
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Fail fast: a broken unit test should stop the build before the (much
      # slower) Rust compile spends runner minutes on it.
      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run tauri build

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pps-study-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
