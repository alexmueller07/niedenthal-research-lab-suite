[package]
name = "lab-recorder"
version = "0.1.0"
description = "Lab Recorder — Niedenthal Emotions Lab, UW-Madison"
authors = ["UW-Madison Psychology, Niedenthal Emotions Lab"]
edition = "2021"

[lib]
name = "lab_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview display the preview JPEG that FFmpeg writes to
# a temp folder. Same pattern pps-app uses to play stimulus clips off the
# Research Drive (pps-app/src/video-task/videos.ts).
tauri = { version = "2", features = ["protocol-asset"] }

# The capture engine. Everything media-related is a sidecar subprocess driven
# from Rust — the webview never gets shell access (see capabilities/default.json).
tauri-plugin-shell = "2"

tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"


serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Recording integrity: checksums for the Research Drive copy, wall-clock stamps
# for the manifest, free-space checks before a session is allowed to start.
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"

# Registering recordings with Round Robin. rustls rather than native-tls so the
# three lab machines do not depend on a platform certificate store being set up
# the same way on each.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebView2 keeps browser accelerator keys (Ctrl+R, Ctrl+Shift+R, F5) enabled by
# default, and they reload the webview — which wipes the recording UI mid-take
# while FFmpeg keeps running. Tauri does not expose the setting, so it is set
# directly on the WebView2 settings object at startup. Versions match what wry
# itself uses, so nothing new actually compiles.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
