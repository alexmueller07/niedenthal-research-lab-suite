name: Build macOS app

# Builds a universal (Intel + Apple Silicon) bundle on a GitHub-hosted macOS
# runner, so it can be produced without owning a Mac — Tauri cannot cross-compile
# macOS from Windows.
#
# APPLE_SIGNING_IDENTITY is set to "-", which is ad-hoc signing. This is not
# cosmetic on macOS: TCC attributes a camera request to the responsible process,
# and an unsigned bundle can leave the FFmpeg sidecar treated as its own
# responsible process — in which case camera access is denied with no prompt and
# no useful error, and the app records black frames. Ad-hoc signing during the
# build (before the dmg is assembled) keeps the helper attributed to the app.
#
# Ad-hoc is not notarisation. On first launch a tester must still right-click ->
# Open, and if macOS claims the app "is damaged":
#   xattr -dr com.apple.quarantine "/Applications/Lab Recorder.app"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (both Apple targets for a universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # A universal bundle needs an FFmpeg for each architecture; Tauri lipos
      # the two sidecars together at bundle time.
      - name: Fetch FFmpeg for both Apple architectures
        run: |
          node scripts/fetch-ffmpeg.mjs --target x86_64-apple-darwin
          node scripts/fetch-ffmpeg.mjs --target aarch64-apple-darwin

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build macOS app (universal, ad-hoc signed)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Confirm the sidecars are signed and inside the bundle
        # A silent camera denial on macOS is expensive to diagnose after the
        # fact, so fail here instead of in the lab.
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Lab Recorder.app"
          codesign --verify --verbose=2 "$APP"
          ls -l "$APP/Contents/MacOS/"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: lab-recorder-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
