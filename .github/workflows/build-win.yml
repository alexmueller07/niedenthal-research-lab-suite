name: Build Windows app

# Produces the NSIS installer for the lab's Windows machines.
#
# The FFmpeg fetch runs before the build and verifies the pinned checksum in
# scripts/ffmpeg-manifest.json. That check is the thing that keeps all three lab
# machines on one encoder — if upstream rotates the build, this job fails rather
# than quietly shipping a different one.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # postinstall fetches and checksum-verifies the pinned FFmpeg sidecars.
      - name: Install dependencies
        run: npm ci

      # Fail fast: a broken unit test should stop the build before the much
      # slower Rust compile spends runner minutes on it.
      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lab-recorder-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
